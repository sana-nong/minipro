spring.application.name=gov-opportunity-backend
server.port=8081

# H2 In-Memory Database for instant, zero-setup demo
spring.datasource.url=jdbc:h2:mem:govoppdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Scheduled Aggregation Engine configuration
app.crawler.auto-start=true
app.crawler.interval-ms=3600000
